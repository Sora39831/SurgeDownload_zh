version: 2

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    binary: surge
    main: .
    ldflags:
      - -s -w 
      - -X github.com/SurgeDM/Surge/cmd.Version={{.Version}}
      - -X github.com/SurgeDM/Surge/cmd.Commit={{.Commit}}
      - -X github.com/SurgeDM/Surge/cmd.BuildTime={{.Date}}

before:
  hooks:
    - ./scripts/package-fonts.sh
    - ./scripts/package-themes.sh

changelog:
  sort: asc

  filters:
    exclude:
      - "^docs:"
      - "^test:"

archives:
  - formats: [ tar.gz ]
    format_overrides:
      - goos: windows
        formats: [ zip ]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

homebrew_casks:
  - name: surge
    repository:
      owner: Sora39831
      name: homebrew-tap
    homepage: "https://github.com/Sora39831/SurgeDownload_zh"
    
    description: "Blazing fast TUI download manager built in Go for power users"
    license: "MIT"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/surge"]
          end
